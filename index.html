<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot AI</title>
    <!-- Linking Google Fonts for icons -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <button id="chatbot-toggler">
        <span class="material-symbols-outlined">support_agent</span>
        <span class="material-symbols-outlined">close</span>
    </button>

    <div class="chatbot-popup">
        <!-- Chatbot Header -->
        <div class="chat-header">
            <div class="header-info">
                <!-- Chatbot Logo -->
                <img class="chatbot-logo" src="assets/logo.png" alt="Chatbot Logo">
                <!-- Chatbot Name -->
                <h2 class="logo-text">Chatbot AI</h2>
            </div>
            <button id="close-chatbot" class="material-symbols-outlined">keyboard_arrow_down</button>
        </div>

      <!-- Chatbot Body -->
        <div class="chat-body">
            <div class="message bot-message">
                <img class="bot-avatar" src="assets/image.png" alt="Bot Avatar">
                <div class="message-text">Welcome to <br /> Chatbot AI</div>
            </div>
        </div>

      <!-- Chatbot Footer -->
        <div class="chat-footer">
            <form action="#" class="chat-form">
                <textarea placeholder="Message..." class="message-input" required></textarea>
                <div class="chat-controls">
                    <button type="button" id="emoji-picker"
                        class="material-symbols-outlined">sentiment_satisfied</button>
                    <div class="file-upload-wrapper">
                        <input type="file" accept="image/*" id="file-input" hidden>
                        <img src="#">
                        <button type="button" id="file-upload" class="material-symbols-outlined">attach_file</button>
                        <button type="button" id="file-cancel" class="material-symbols-outlined">close</button>
                    </div>
                    <button type="submit" id="send-message" class="material-symbols-outlined">arrow_upward</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Linking Emoji Mart script for emoji picker -->
    <script src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>

    <!-- Linking custom script -->
    <script src="script.js"></script>
  </body>
</html>
